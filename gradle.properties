org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Kotlin plugins are declared in the individual modules: :core (JVM) must build even without the Android SDK.
kotlin.pluginLoadedInMultipleProjects.ignore=true
# Version shown in the app: CI appends the build number (e.g. 0.6.24).
appVersion=0.6
