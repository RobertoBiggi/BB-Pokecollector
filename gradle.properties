org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# I plugin Kotlin sono dichiarati nei singoli moduli: :core (JVM) va compilato anche senza Android SDK.
kotlin.pluginLoadedInMultipleProjects.ignore=true
# Versione mostrata nell'app: la CI aggiunge il numero di build (es. 0.6.24).
appVersion=0.6
