# TEMPORARY: checks on a branch the signing steps of the release job, with a throwaway key. To be deleted before merging.
name: Release dry run

on:
  push:
    branches: [ccr-da55776b-conrjq]
    paths: [.github/workflows/release-dry-run.yml]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.unsigned.outputs.version }}
      sha256: ${{ steps.unsigned.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
      - run: ./gradlew :app:assembleRelease -PversionCode="$(git rev-list --count HEAD)" --console=plain
      - name: Unsigned release APK
        id: unsigned
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          version=$("$tools/aapt" dump badging "$apk" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          [[ "$version" =~ ^[0-9]+(\.[0-9]+)+$ ]] || { echo "::error::Unexpected version name: $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$apk" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          archive: false
          if-no-files-found: error
          retention-days: 1

  sign:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.build.outputs.version }}
      APK_SHA256: ${{ needs.build.outputs.sha256 }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-release-unsigned.apk
          path: unsigned
      - name: Same APK as the build job
        run: |
          set -euo pipefail
          ls -l unsigned
          test -f unsigned/app-release-unsigned.apk
          echo "$APK_SHA256  unsigned/app-release-unsigned.apk" | sha256sum --check --strict -
      - name: Sign with a throwaway key
        env:
          RELEASE_KEYSTORE_PASSWORD: dry-run-pass
          RELEASE_KEY_ALIAS: dryrun
          RELEASE_KEY_PASSWORD: dry-run-pass
        run: |
          set -euo pipefail
          umask 077
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          keystore="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$keystore"' EXIT
          keytool -genkeypair -keystore "$keystore" -storepass "$RELEASE_KEYSTORE_PASSWORD" -keypass "$RELEASE_KEY_PASSWORD" \
            -alias "$RELEASE_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 1 -dname "CN=dry run" -storetype JKS
          java -version
          "$tools/apksigner" sign --ks "$keystore" --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --ks-pass env:RELEASE_KEYSTORE_PASSWORD --key-pass env:RELEASE_KEY_PASSWORD \
            --out bb-pokecollector.apk unsigned/app-release-unsigned.apk
      - name: Check the APK
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          apk=bb-pokecollector.apk
          echo "build-tools: $tools"
          "$tools/apksigner" verify --verbose --print-certs "$apk" | head -20
          "$tools/zipalign" -c 4 "$apk"
          if "$tools/aapt" dump badging "$apk" | grep -q "application-debuggable"; then echo "::error::debuggable"; exit 1; fi
          "$tools/aapt" dump badging "$apk" | grep -q "versionName='$VERSION'"
          unzip -l "$apk" | grep -E "lib/|resources.arsc" || true
          echo "Dry run OK: $VERSION"
