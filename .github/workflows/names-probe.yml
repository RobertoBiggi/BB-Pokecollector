# Probe temporaneo: nomi delle carte speciali (★, δ, ◇, LV.X…) su Cardmarket e TCGdex. Da eliminare dopo l'analisi.
name: Names probe

on:
  push:
    paths: [".github/workflows/names-probe.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Nomi speciali
        run: |
          cat > probe.py <<'PY'
          import json, re, urllib.request
          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "CardCollection-probe"})
              with urllib.request.urlopen(req, timeout=120) as r:
                  return json.load(r)
          cm = get("https://downloads.s3.cardmarket.com/productCatalog/productList/products_singles_6.json")["products"]
          guide = {g["idProduct"]: g for g in get("https://downloads.s3.cardmarket.com/productCatalog/priceGuide/price_guide_6.json")["priceGuides"]}
          special = re.compile(r"Star|Prism|δ|Delta|◇|★|☆", re.I)
          sets = {1546: "EX Deoxys", 1548: "Unseen Forces", 1551: "Holon Phantoms", 1553: "Dragon Frontiers", 1617: "POP 5", 2065: "Ultra Prism"}
          for exp, label in sets.items():
              prods = [p for p in cm if p.get("idExpansion") == exp]
              print(f"===== Cardmarket {label} ({exp}): {len(prods)} prodotti")
              for p in prods:
                  if special.search(p["name"]) or "Rayquaza" in p["name"]:
                      g = guide.get(p["idProduct"], {})
                      print(f'  {p["idProduct"]}\t{p["name"]}\tmeta={p.get("idMetacard")}\ttrend={g.get("trend")}\ttrend-holo={g.get("trend-holo")}')
          for pid in [276425, 276416]:
              p = next((x for x in cm if x["idProduct"] == pid), None)
              print("PRODOTTO", pid, p and p["name"], p and p.get("idExpansion"), guide.get(pid, {}).get("trend"))
          PY
          python3 probe.py
