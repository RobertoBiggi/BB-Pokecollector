# Builds and tests the app. On every push to main it also publishes a GitHub Release with the APK signed
# with the release key (repo secret), which Obtainium uses for updates.
name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  # On main a run is never interrupted halfway, to avoid leaving a half-published release.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # The card database goes into the APK as an asset: it is taken from the "catalog" release (if missing, the APK downloads the database from Settings).
      - name: Database delle carte
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p catalog-db
          gh release download catalog -p cards.sqlite -D catalog-db || echo "::warning::release catalog assente: l'APK non include il database"
          echo "CATALOG_DB=$PWD/catalog-db/cards.sqlite" >> "$GITHUB_ENV"

      - name: Numero di build
        run: echo "BUILD_NUMBER=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      # assembleRelease without a key produces an unsigned APK: it serves to verify R8 on every push.
      - name: Test, lint e build
        run: >
          ./gradlew :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease
          -PversionCode="$BUILD_NUMBER" --stacktrace --console=plain

      # Room rewrites app/schemas while compiling: a difference means the database schema changed without a new version,
      # or the new version's file was not committed (see data/local/Migrations.kt).
      - name: Schema del database committato
        run: |
          changes=$(git status --porcelain -- app/schemas)
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::Lo schema del database è cambiato: aumenta version in AppDatabase, aggiungi la migrazione in Migrations.kt e committa il file in app/schemas."
            exit 1
          fi

      - name: Verifica firma e pacchetto dell'APK debug
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          apk=$(ls app/build/outputs/apk/debug/*.apk)
          "$tools/aapt" dump badging "$apk" | grep -E "^(package|sdkVersion|targetSdkVersion|application-debuggable)" || true
          # Test builds use the repo's debug keystore.
          expected="b66e03971fb82eef2a2af8bcd4b64ecec1cdbc3fb18569d9ad612ba9e26e9589"
          actual=$("$tools/apksigner" verify --print-certs "$apk" | grep -m1 "SHA-256 digest" | awk '{print $NF}')
          test "$actual" = "$expected"
          "$tools/aapt" dump badging "$apk" | grep -q "package: name='com.robertobiggi.cardcollection'"
          # The release build (minified by R8) must contain the Pokémon names.
          unzip -l app/build/outputs/apk/release/*.apk | grep -q "com/robertobiggi/cardcollection/core/model/pokemon-names.tsv"

      - name: Rinomina APK di prova
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          apk=$(ls app/build/outputs/apk/debug/*.apk)
          version=$("$tools/aapt" dump badging "$apk" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          mkdir -p dist
          cp "$apk" "dist/card-collection-$version.apk"

      # Only for pushes to the repo: APKs of third-party pull requests are not published.
      - name: Pubblica APK di prova
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          # archive: false uploads the single .apk as-is (no zip); the artifact takes the file's name.
          path: dist/*.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Pubblica report in caso di errore
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            core/build/reports/
          if-no-files-found: ignore
          retention-days: 7

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      HAS_KEY: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Chiave di release assente
        if: env.HAS_KEY != 'true'
        run: |
          echo "::warning::Secret RELEASE_KEYSTORE_BASE64 non impostato, nessuna release pubblicata."

      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@v4
        if: env.HAS_KEY == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        if: env.HAS_KEY == 'true'

      # The card database goes into the APK as an asset: it is taken from the "catalog" release (if missing, the APK downloads the database from Settings).
      - name: Database delle carte
        if: env.HAS_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p catalog-db
          gh release download catalog -p cards.sqlite -D catalog-db || echo "::warning::release catalog assente: l'APK non include il database"
          echo "CATALOG_DB=$PWD/catalog-db/cards.sqlite" >> "$GITHUB_ENV"

      - name: Build release firmata
        if: env.HAS_KEY == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export RELEASE_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RELEASE_KEYSTORE_PATH"
          build=$(git rev-list --count HEAD)
          ./gradlew :app:assembleRelease -PversionCode="$build" --console=plain
          rm -f "$RELEASE_KEYSTORE_PATH"
          echo "BUILD_NUMBER=$build" >> "$GITHUB_ENV"

      - name: Verifica firma release
        if: env.HAS_KEY == 'true'
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          apk=app/build/outputs/apk/release/app-release.apk
          expected="a48f249096edae297c98b8e05f99eecea99e61948e6e510c6b49fd6d0271e2ab"
          actual=$("$tools/apksigner" verify --print-certs "$apk" | grep -m1 "SHA-256 digest" | awk '{print $NF}')
          echo "SHA-256 firma: $actual"
          test "$actual" = "$expected"
          if "$tools/aapt" dump badging "$apk" | grep -q "application-debuggable"; then echo "APK release debuggable"; exit 1; fi
          version=$("$tools/aapt" dump badging "$apk" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Pubblica GitHub Release
        if: env.HAS_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $tag già presente"; exit 0
          fi
          cp app/build/outputs/apk/release/app-release.apk "card-collection-$VERSION.apk"
          gh release create "$tag" "card-collection-$VERSION.apk" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "$VERSION" --generate-notes --latest
