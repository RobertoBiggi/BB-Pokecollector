# Builds and tests the app on every push and pull request. On every push to main it also publishes a GitHub Release
# with the APK signed with the release key (repository secrets, never in the repo), which the README download button
# and Obtainium use for updates.
name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  # On main a run is never interrupted halfway, to avoid leaving a half-published release.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build number
        run: echo "BUILD_NUMBER=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      # assembleRelease without a key produces an unsigned APK: it serves to verify R8 on every push.
      - name: Test, lint and build
        run: >
          ./gradlew :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease
          -PversionCode="$BUILD_NUMBER" --stacktrace --console=plain

      # Room rewrites app/schemas while compiling: a difference means the database schema changed without a new version,
      # or the new version's file was not committed (see data/local/Migrations.kt).
      - name: Database schema committed
        run: |
          changes=$(git status --porcelain -- app/schemas)
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::The database schema changed: raise version in AppDatabase, add the migration to Migrations.kt and commit the file in app/schemas."
            exit 1
          fi

      - name: Check the APK package
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          apk=$(ls app/build/outputs/apk/debug/*.apk)
          "$tools/aapt" dump badging "$apk" | grep -E "^(package|sdkVersion|targetSdkVersion|application-debuggable)" || true
          "$tools/aapt" dump badging "$apk" | grep -q "package: name='com.robertobiggi.bbpokecollector'"
          # The release build (minified by R8) must contain the Pokémon names.
          unzip -l app/build/outputs/apk/release/*.apk | grep -q "com/robertobiggi/cardcollection/core/model/pokemon-names.tsv"

      - name: Rename the test APK
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          apk=$(ls app/build/outputs/apk/debug/*.apk)
          version=$("$tools/aapt" dump badging "$apk" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          mkdir -p dist
          cp "$apk" "dist/bb-pokecollector-$version.apk"

      # Branches other than main, for pushes and manual runs ("Run workflow"), never for third-party pull requests.
      # Kept 3 days. Test APKs are signed with the runner's
      # own debug key, so each one has to be installed on a clean phone (it can't update another build).
      - name: Upload the test APK
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          # archive: false uploads the single .apk as-is (no zip); the artifact takes the file's name.
          path: dist/*.apk
          archive: false
          if-no-files-found: error
          retention-days: 3

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            core/build/reports/
          if-no-files-found: ignore
          retention-days: 7

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      HAS_KEY: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
    steps:
      # Without the key nothing is published: failing makes it visible on main instead of passing silently.
      - name: Release key present
        if: env.HAS_KEY != 'true'
        run: |
          echo "::error::The RELEASE_KEYSTORE_BASE64 secret is not set: no release published."
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Signed release build
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export RELEASE_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$RELEASE_KEYSTORE_PATH"' EXIT
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RELEASE_KEYSTORE_PATH"
          ./gradlew :app:assembleRelease -PversionCode="$(git rev-list --count HEAD)" --console=plain

      # The certificate must be the expected one: a wrong key in the secrets would publish an APK that can't update the installed app.
      - name: Check the release signature
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          apk=app/build/outputs/apk/release/app-release.apk
          expected="7b9385ed9d9eb9ce96974eef3e36e148548dc1e565658a6ce1d8951977d46b3f"
          actual=$("$tools/apksigner" verify --print-certs "$apk" | grep -m1 "SHA-256 digest" | awk '{print $NF}')
          echo "Signing certificate SHA-256: $actual"
          test "$actual" = "$expected"
          if "$tools/aapt" dump badging "$apk" | grep -q "application-debuggable"; then echo "::error::The release APK is debuggable"; exit 1; fi
          version=$("$tools/aapt" dump badging "$apk" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $tag already exists"; exit 0
          fi
          # One APK per Release, with a fixed name: the README download link (releases/latest/download/bb-pokecollector.apk) always points to the latest Release.
          cp app/build/outputs/apk/release/app-release.apk bb-pokecollector.apk
          gh release create "$tag" bb-pokecollector.apk --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "$VERSION" --generate-notes --latest
