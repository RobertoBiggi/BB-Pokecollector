# Builds and tests the app on every push and pull request. On every push to main it also publishes a GitHub Release
# with the APK signed with the release key (only the latest release is kept) (repository secrets, never in the repo), which the README download button
# and Obtainium use for updates.
# Actions are pinned to a full commit SHA (the tag in the comment); Dependabot proposes the updates.
name: Android CI

# Changes that only touch the README, the docs or other Markdown files do not build or publish anything.
on:
  push:
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  # On main a run is never interrupted halfway, to avoid leaving a half-published release.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.unsigned.outputs.version }}
      sha256: ${{ steps.unsigned.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      # Open-source (MIT) cache of the Gradle home, written only by main. The default "enhanced" provider is a
      # closed-source component; it is not needed here.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - name: Build number
        run: echo "BUILD_NUMBER=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      # assembleRelease without a key produces an unsigned APK: it verifies R8 on every push, and on main
      # it is the APK the release job signs (no second build).
      - name: Test, lint and build
        run: >
          ./gradlew :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease
          -PversionCode="$BUILD_NUMBER" --stacktrace --console=plain

      # Room rewrites app/schemas while compiling: a difference means the database schema changed without a new version,
      # or the new version's file was not committed (see data/local/Migrations.kt).
      - name: Database schema committed
        run: |
          changes=$(git status --porcelain -- app/schemas)
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::The database schema changed: raise version in AppDatabase, add the migration to Migrations.kt and commit the file in app/schemas."
            exit 1
          fi

      - name: Check the APK package
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          apk=$(ls app/build/outputs/apk/debug/*.apk)
          "$tools/aapt" dump badging "$apk" | grep -E "^(package|sdkVersion|targetSdkVersion|application-debuggable)" || true
          "$tools/aapt" dump badging "$apk" | grep -q "package: name='com.robertobiggi.bbpokecollector'"
          # The release build (minified by R8) must contain the Pokémon names.
          unzip -l app/build/outputs/apk/release/*.apk | grep -q "com/robertobiggi/cardcollection/core/model/pokemon-names.tsv"

      - name: Rename the test APK
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          apk=$(ls app/build/outputs/apk/debug/*.apk)
          version=$("$tools/aapt" dump badging "$apk" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          mkdir -p dist
          cp "$apk" "dist/bb-pokecollector-$version.apk"

      # Branches other than main, for pushes and manual runs ("Run workflow"), never for third-party pull requests.
      # Kept 3 days. Test APKs are signed with the runner's
      # own debug key, so each one has to be installed on a clean phone (it can't update another build).
      - name: Upload the test APK
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # archive: false uploads the single .apk as-is (no zip); the artifact takes the file's name.
          path: dist/*.apk
          archive: false
          if-no-files-found: error
          retention-days: 3

      # Main only: the unsigned release APK goes to the release job, with its version and SHA-256 as job outputs.
      # The release job checks the hash, so it signs exactly the file built here.
      - name: Unsigned release APK
        id: unsigned
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          version=$("$tools/aapt" dump badging "$apk" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          [[ "$version" =~ ^[0-9]+(\.[0-9]+)+$ ]] || { echo "::error::Unexpected version name: $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$apk" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload the unsigned release APK
        if: steps.unsigned.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          archive: false
          if-no-files-found: error
          retention-days: 1

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            app/build/reports/
            core/build/reports/
          if-no-files-found: ignore
          retention-days: 7

  # Signs the APK built by the build job: no checkout and no Gradle here, so the release key is only ever seen by
  # apksigner (Android SDK of the runner) and never by build scripts, plugins or dependencies.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      HAS_KEY: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
      VERSION: ${{ needs.build.outputs.version }}
      APK_SHA256: ${{ needs.build.outputs.sha256 }}
    steps:
      # Without the key nothing is published: failing makes it visible on main instead of passing silently.
      - name: Release key present
        if: env.HAS_KEY != 'true'
        run: |
          echo "::error::The RELEASE_KEYSTORE_BASE64 secret is not set: no release published."
          exit 1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-release-unsigned.apk
          path: unsigned

      - name: Same APK as the build job
        run: |
          set -euo pipefail
          ls -l unsigned
          test -f unsigned/app-release-unsigned.apk
          echo "$APK_SHA256  unsigned/app-release-unsigned.apk" | sha256sum --check --strict -

      # The keystore exists only for this step, readable only by the runner user; passwords reach apksigner
      # through environment variables, never on the command line.
      - name: Sign the APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          keystore="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$keystore"' EXIT
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$keystore"
          "$tools/apksigner" sign --ks "$keystore" --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --ks-pass env:RELEASE_KEYSTORE_PASSWORD --key-pass env:RELEASE_KEY_PASSWORD \
            --out bb-pokecollector.apk unsigned/app-release-unsigned.apk

      # The certificate must be the expected one: a wrong key in the secrets would publish an APK that can't update the installed app.
      - name: Check the release APK
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          apk=bb-pokecollector.apk
          expected="7b9385ed9d9eb9ce96974eef3e36e148548dc1e565658a6ce1d8951977d46b3f"
          actual=$("$tools/apksigner" verify --print-certs "$apk" | grep -m1 "SHA-256 digest" | awk '{print $NF}')
          echo "Signing certificate SHA-256: $actual"
          test "$actual" = "$expected"
          # Android refuses to install an APK whose uncompressed entries (resources.arsc) are not aligned.
          "$tools/zipalign" -c 4 "$apk"
          if "$tools/aapt" dump badging "$apk" | grep -q "application-debuggable"; then echo "::error::The release APK is debuggable"; exit 1; fi
          "$tools/aapt" dump badging "$apk" | grep -q "versionName='$VERSION'"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $tag already exists"; exit 0
          fi
          # Release notes written here, not generated by GitHub: only the latest release is kept, so there is no previous
          # release to compare with and the automatic "Full Changelog" link would break. The description lists the commits
          # since the previous release (still there at this point; the cleanup step below deletes it afterwards).
          prev=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 100 --json tagName,isLatest \
            --jq '[.[] | select(.tagName | test("^v[0-9]+(\\.[0-9]+)+$"))] | (map(select(.isLatest))[0] // .[0]) | .tagName // empty')
          if [ -n "$prev" ]; then
            commits=$(gh api "repos/$GITHUB_REPOSITORY/compare/$prev...$GITHUB_SHA" --jq '.commits | reverse')
          else
            commits=$(gh api "repos/$GITHUB_REPOSITORY/commits?sha=$GITHUB_SHA&per_page=15")
          fi
          {
            echo "## What's changed"
            echo
            # Merge commits and the database changelog commits (docs/DATABASE_CHANGELOG.md and badges) are left out: they
            # describe the card database, which is published on its own and not with the app.
            echo "$commits" | jq -r '.[] | select(.commit.message | (startswith("Merge") or startswith("Database changelog")) | not)
              | "- " + (.commit.message | split("\n")[0]) + " (" + .sha[0:7] + ")"'
          } > notes.md
          # One APK per Release, with a fixed name: the README download link (releases/latest/download/bb-pokecollector.apk) always points to the latest Release.
          gh release create "$tag" bb-pokecollector.apk --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "$VERSION" --notes-file notes.md --latest

      # Only the latest release is kept: older version releases and their tags are deleted. Only tags like v1.2.3 are touched
      # (the "catalog" release with the card database stays), and only after the new release was published successfully.
      - name: Delete the older releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '.[].tagName' \
            | grep -E '^v[0-9]+(\.[0-9]+)+$' | grep -vxF "$tag" \
            | while read -r old; do
                echo "Deleting $old"
                gh release delete "$old" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
              done
