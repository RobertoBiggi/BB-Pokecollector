# Takes the screenshots of the README on an Android emulator with real data (catalog, images and prices of a
# "Mawile" collection) and commits them to docs/screenshots on the same branch.
# Actions are pinned to a full commit SHA (the tag in the comment); Dependabot proposes the updates.
# Runs on demand, or when the screenshot test changes on a branch other than main.
name: README screenshots

on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - app/src/androidTest/**
      - .github/workflows/screenshots.yml
      - .github/scripts/readme-screenshots.sh

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The token is not left in .git/config: only the final commit step uses it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      # Card database from the "catalog" release; the script copies it into the app before the test.
      - name: Card database
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download catalog -p cards.sqlite -D catalog-db

      - name: App and test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace --console=plain

      # The emulator needs a few GB for its data partition: removes SDKs the runner has and this job does not use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Screenshots on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/readme-screenshots.sh

      # Also after a failed test: the screenshots taken until then help to see where it stopped.
      - name: Commit the screenshots
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then echo "Screenshots unchanged"; exit 0; fi
          git commit -m "README screenshots updated"
          # Same header actions/checkout would have saved, passed to this push only and masked in the log.
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:${GITHUB_REF_NAME}"
