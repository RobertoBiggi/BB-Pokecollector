# Takes the screenshots of the README on an Android emulator with real data (catalog, images and prices of a
# "Mawile" collection) and commits them to docs/screenshots on the same branch.
# Runs on demand, or when the screenshot test changes on a branch other than main.
name: README screenshots

on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - app/src/androidTest/**
      - .github/workflows/screenshots.yml
      - .github/scripts/readme-screenshots.sh

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # The workflow's token can read the release even while the repository is private; the script copies the file into the app.
      - name: Card database
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download catalog -p cards.sqlite -D catalog-db

      - name: App and test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace --console=plain

      # The emulator needs a few GB for its data partition: removes SDKs the runner has and this job does not use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Screenshots on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/readme-screenshots.sh

      # Also after a failed test: the screenshots taken until then help to see where it stopped.
      - name: Commit the screenshots
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then echo "Screenshots unchanged"; exit 0; fi
          git commit -m "README screenshots updated"
          git push origin "HEAD:${GITHUB_REF_NAME}"
