# Stampa nei log una risposta reale di TCGdex, TCGCSV o pokemontcg.io, per verificare le API quando si
# sviluppa da un ambiente che non le raggiunge. Si avvia a mano da Actions indicando API e percorso,
# es. "tcgdex" + "ja/cards/M3-117" oppure "tcgcsv" + "85/24600/prices".
name: API probe

on:
  # Un push che modifica questo file esegue le interrogazioni fisse dello step "Probe predefinito".
  push:
    paths: [".github/workflows/tcgdex-probe.yml"]
  workflow_dispatch:
    inputs:
      api:
        description: "API da interrogare"
        type: choice
        options: [tcgdex, tcgcsv, pokemontcg]
        default: tcgdex
      path:
        description: "Percorso dopo la base (tcgdex: https://api.tcgdex.net/v2/, tcgcsv: https://tcgcsv.com/tcgplayer/, pokemontcg: https://api.pokemontcg.io/v2/)"
        required: true
        default: "en/cards?name=Mawile"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Risposta API
        if: github.event_name == 'workflow_dispatch'
        env:
          API: ${{ inputs.api }}
          API_PATH: ${{ inputs.path }}
        run: |
          set -euo pipefail
          case "$API" in
            tcgdex) base="https://api.tcgdex.net/v2/" ;;
            tcgcsv) base="https://tcgcsv.com/tcgplayer/" ;;
            pokemontcg) base="https://api.pokemontcg.io/v2/" ;;
            *) echo "API non valida"; exit 1 ;;
          esac
          # Solo caratteri sicuri per un percorso con query string.
          if ! [[ "$API_PATH" =~ ^[A-Za-z0-9._/?=\&%:,*-]{1,200}$ ]]; then echo "Percorso non valido"; exit 1; fi
          code=$(curl -sS --max-time 120 -o body.json -w "%{http_code} %{time_total}s" "$base$API_PATH" || echo "errore curl")
          echo "HTTP $code"
          jq . body.json 2>/dev/null | head -c 200000 || head -c 5000 body.json

      - name: Probe predefinito
        if: github.event_name == 'push'
        run: |
          set -uo pipefail
          for url in "https://api.tcgdex.net/v2/en/cards/me01-046" "https://tcgcsv.com/tcgplayer/85/groups"; do
            echo "===== $url"
            curl -sS --max-time 60 -o body.json -w "HTTP %{http_code} %{time_total}s\n" "$url" || echo "errore curl"
            jq -c . body.json 2>/dev/null | head -c 3000
            echo
          done
