# Stampa nei log una risposta reale di TCGdex o pokemontcg.io, per verificare le API quando si sviluppa
# da un ambiente che non le raggiunge. Si avvia a mano da Actions indicando API e percorso,
# es. "tcgdex" + "ja/cards/M3-117" oppure "pokemontcg" + "cards?q=name:mawile".
name: API probe

on:
  # Un push che modifica questo file esegue le interrogazioni fisse dello step "Probe predefinito".
  push:
    paths: [".github/workflows/tcgdex-probe.yml"]
  workflow_dispatch:
    inputs:
      api:
        description: "API da interrogare"
        type: choice
        options: [tcgdex, pokemontcg]
        default: tcgdex
      path:
        description: "Percorso dopo la base (tcgdex: https://api.tcgdex.net/v2/, pokemontcg: https://api.pokemontcg.io/v2/)"
        required: true
        default: "en/cards?name=Mawile"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Risposta API
        if: github.event_name == 'workflow_dispatch'
        env:
          API: ${{ inputs.api }}
          API_PATH: ${{ inputs.path }}
        run: |
          set -euo pipefail
          case "$API" in
            tcgdex) base="https://api.tcgdex.net/v2/" ;;
            pokemontcg) base="https://api.pokemontcg.io/v2/" ;;
            *) echo "API non valida"; exit 1 ;;
          esac
          # Solo caratteri sicuri per un percorso con query string.
          if ! [[ "$API_PATH" =~ ^[A-Za-z0-9._/?=\&%:,*-]{1,200}$ ]]; then echo "Percorso non valido"; exit 1; fi
          code=$(curl -sS --max-time 120 -o body.json -w "%{http_code} %{time_total}s" "$base$API_PATH" || echo "errore curl")
          echo "HTTP $code"
          jq . body.json 2>/dev/null | head -c 200000 || head -c 5000 body.json

      - name: Probe predefinito
        if: github.event_name == 'push'
        run: |
          set -uo pipefail
          probe() {
            echo "===== $1"
            code=$(curl -sS --max-time 90 -o body.json -w "%{http_code} %{time_total}s" "$1" || echo "errore curl")
            echo "HTTP $code"
            jq -c . body.json 2>/dev/null | head -c 6000 || head -c 2000 body.json
            echo
          }
          P=https://api.pokemontcg.io/v2
          SEL="select=id,name,number,rarity,set,images,tcgplayer,cardmarket"
          probe "$P/sets?orderBy=-releaseDate&pageSize=10&select=id,name,ptcgoCode,printedTotal,total,releaseDate"
          probe "$P/cards?q=name:mawile&pageSize=1"
          probe "$P/cards?q=set.ptcgoCode:SVI%20number:46&$SEL"
          probe "$P/cards?q=set.ptcgoCode:MEG%20number:46&$SEL"
          probe "$P/cards?q=set.name:%22Lost%20Origin%22%20number:TG17&$SEL"
          probe "$P/cards?q=name:mawile%20set.ptcgoCode:PHF&$SEL"
          probe "https://api.tcgdex.net/v2/en/sets/me01"
