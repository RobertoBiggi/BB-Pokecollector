# Stampa nei log una risposta reale di TCGdex, per verificare l'API quando si sviluppa da un ambiente
# che non la raggiunge. Si avvia a mano da Actions indicando il percorso, es. "ja/cards/M3-117".
name: API probe

on:
  workflow_dispatch:
    inputs:
      path:
        description: "Percorso dopo https://api.tcgdex.net/v2/ (es. en/cards?name=Mawile)"
        required: true
        default: "en/cards?name=Mawile"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Risposta TCGdex
        env:
          API_PATH: ${{ inputs.path }}
        run: |
          set -euo pipefail
          # Solo caratteri sicuri per un percorso con query string.
          if ! [[ "$API_PATH" =~ ^[A-Za-z0-9._/?=\&%-]{1,200}$ ]]; then echo "Percorso non valido"; exit 1; fi
          curl -sS --max-time 30 "https://api.tcgdex.net/v2/$API_PATH" | jq . | head -c 200000
