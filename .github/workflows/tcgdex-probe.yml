# Stampa nei log una risposta reale di TCGdex o pokemontcg.io, per verificare le API quando si
# sviluppa da un ambiente che non le raggiunge. Si avvia a mano da Actions indicando API e percorso,
# es. "tcgdex" + "ja/cards/M3-117".
name: API probe

on:
  # Un push che modifica questo file esegue le interrogazioni fisse dello step "Probe predefinito".
  push:
    paths: [".github/workflows/tcgdex-probe.yml"]
  workflow_dispatch:
    inputs:
      api:
        description: "API da interrogare"
        type: choice
        options: [tcgdex, pokemontcg]
        default: tcgdex
      path:
        description: "Percorso dopo la base (tcgdex: https://api.tcgdex.net/v2/, pokemontcg: https://api.pokemontcg.io/v2/)"
        required: true
        default: "en/cards?name=Mawile"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Risposta API
        if: github.event_name == 'workflow_dispatch'
        env:
          API: ${{ inputs.api }}
          API_PATH: ${{ inputs.path }}
        run: |
          set -euo pipefail
          case "$API" in
            tcgdex) base="https://api.tcgdex.net/v2/" ;;
            pokemontcg) base="https://api.pokemontcg.io/v2/" ;;
            *) echo "API non valida"; exit 1 ;;
          esac
          # Solo caratteri sicuri per un percorso con query string.
          if ! [[ "$API_PATH" =~ ^[A-Za-z0-9._/?=\&%:,*-]{1,200}$ ]]; then echo "Percorso non valido"; exit 1; fi
          code=$(curl -sS --max-time 120 -o body.json -w "%{http_code} %{time_total}s" "$base$API_PATH" || echo "errore curl")
          echo "HTTP $code"
          jq . body.json 2>/dev/null | head -c 200000 || head -c 5000 body.json

      - name: Probe predefinito
        if: github.event_name == 'push'
        run: |
          set -uo pipefail
          # Elenco dei set inglesi con sigla stampata e numero di carte, per confrontarli con le sigle Cardmarket.
          curl -sS --max-time 60 https://api.tcgdex.net/v2/en/sets | jq -r '.[].id' > en.txt
          wc -l en.txt
          xargs -P 8 -I{} sh -c 'curl -sS --max-time 60 "https://api.tcgdex.net/v2/en/sets/{}" | jq -r "[\"EN\", .id, .name, (.abbreviation.official // \"\"), (.abbreviation.localized // \"\"), (.cardCount.official // \"\" | tostring), (.serie.id // \"\"), (.logo // \"\")] | @tsv"' < en.txt | sort > en-details.tsv
          wc -l en-details.tsv
          cat en-details.tsv
          curl -sS --max-time 60 https://api.tcgdex.net/v2/ja/sets | jq -r '.[] | ["JA", .id, .name, (.cardCount.official // "" | tostring)] | @tsv'
