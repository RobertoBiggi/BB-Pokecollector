# Proposes updates of the GitHub Actions used by the workflows (pinned to a commit SHA), once a month in a single PR.
# Gradle dependencies stay pinned by hand in gradle/libs.versions.toml.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "CI"
